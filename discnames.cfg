# Friendly names for physical CD32/CDTV discs.
#
# NOT read from here. Install to:
#     /media/fat/saves/Minimig/discnames.cfg
# (AKIKO_NVRAM_DIR in support/minimig/akiko_cd32.cpp). This copy is the
# reference for the format and a place to keep entries under version control.
#
# Format: <identity> = <friendly name>, one per line. '#' and ';' start a
# comment. Whitespace around either side is ignored.
#
# The identity is what the disc reports, and it is what the per-game NVRAM slot
# is keyed on. To find it for the disc currently in the tray:
#     grep set_cd_path /tmp/akiko_dbg.log | tail -2
#
# Why this file exists: CD32 discs routinely do not carry their own title.
# Simon the Sorcerer's official pressing reports volume ID "CD32_TEST", every
# other ISO9660 name field is empty, and the root directory is numbered .out
# chunks. There is nothing on the disc to read a real name from, so the only
# honest source is the person holding it.
#
# Effect: the save becomes "<friendly name>.nvr" rather than
# "cd32-<hash>.nvr", so the saves directory is readable at a glance. Adding an
# entry for a disc that has already been used triggers a one-shot rename of the
# existing save, so naming a disc later loses nothing.

CD32_TEST = Simon the Sorcerer
