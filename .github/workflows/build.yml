# Cross-build MiSTer for the DE10-Nano (arm-none-linux-gnueabihf).
#
# This exists because there is no local build environment: the dev machine is
# Windows without WSL, and ARM never shipped a Windows-hosted build of the
# toolchain this project pins (10.2-2020.11 has x86_64/aarch64 Linux hosts
# only -- its mingw-w64 packages target bare metal). Newer arm-gnu-toolchain
# releases (12.3.rel1+) do have Windows hosts, but they bring a newer glibc
# sysroot and therefore a runtime-compatibility question against the MiSTer's
# own glibc. CI sidesteps that by using the exact pinned toolchain.
#
# Every ARM library the link needs (libImlib2, libfreetype, libpng16, libbz2,
# libz, libbluetooth) is a prebuilt .so committed under lib/, so the toolchain
# is the only external dependency.
name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # release.yml calls this to build what it publishes, so a release is the
  # same build, from the same steps, as every CI run -- not a second copy of
  # them that drifts. Being callable publishes nothing by itself; only
  # release.yml does, and only when started by hand.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Keep in step with setup_default_toolchain.sh.
      MISTER_GCC_VER: 10.2-2020.11
      MISTER_GCC_HOST_ARCH: x86_64

    steps:
      - uses: actions/checkout@v4

      # Parses every C++ source with the HOST compiler, before the toolchain is
      # even downloaded. Seconds against the cross-build's minutes, and it fails
      # on the things most likely to be wrong in a change that was not built
      # locally: a typo, and a static_assert that no longer holds -- the OSD
      # pages tie their row counts to their menumask that way, and a row added
      # without its hint is caught here rather than after a toolchain fetch.
      #
      # Not a substitute for the build below. It does not link, char and long
      # differ from the target, and four files it cannot parse are listed with
      # reasons in the script, which prints them on every run.
      # An upload-artifact step with no retention-days keeps the repository
      # default and never expires. 493 such artifacts filled the 500 MB quota
      # on 2026-09-28, and a full quota fails the upload step -- so every
      # build fails, including on a docs-only PR that touches no code. That
      # looks like a broken build and sends you looking in the wrong place.
      # Cheaper to refuse the step than to diagnose it again.
      - name: Artifact uploads must set retention-days
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .github/check-artifact-retention.py

      - name: Host syntax check
        run: ./syntax_check.sh

      - name: Resolve toolchain package name
        id: tc
        run: |
          echo "name=gcc-arm-${MISTER_GCC_VER}-${MISTER_GCC_HOST_ARCH}-arm-none-linux-gnueabihf" >> "$GITHUB_OUTPUT"

      # Sizeable download, so cache it. The key includes the full package name,
      # so bumping MISTER_GCC_VER invalidates the cache automatically.
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ steps.tc.outputs.name }}
          key: toolchain-${{ steps.tc.outputs.name }}

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          f="${{ steps.tc.outputs.name }}.tar.xz"
          curl -fL --retry 3 --retry-delay 5 -o "$f" \
            "https://developer.arm.com/-/media/Files/downloads/gnu-a/${MISTER_GCC_VER}/binrel/${f}"
          tar xf "$f"
          rm "$f"

      # setup_default_toolchain.sh is deliberately not used: it must be sourced,
      # and a sourced PATH does not survive between workflow steps. It also
      # exports CC=.../arm-none-gnueabihf-gcc, which is not the real binary name
      # (arm-none-linux-gnueabihf-gcc). That is harmless -- the Makefile assigns
      # CC itself, and a Makefile assignment beats the environment -- but it is
      # not something to build on.
      - name: Add toolchain to PATH
        run: echo "${{ github.workspace }}/${{ steps.tc.outputs.name }}/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: arm-none-linux-gnueabihf-gcc --version

      - name: Build
        run: make

      # MEASUREMENT ONLY: step 1 of the ARM-CPU plan. Times the ARM -> DDR3 ->
      # FPGA -> ARM round trip against latprobe_ddr3.v in the core. Built here
      # so it comes out of the same artifact as Main, ready to copy over.
      - name: Build latprobe
        run: make -C tools/latprobe

      # MEASUREMENT ONLY: step 3 of the ARM-CPU plan. A 68000 (Musashi) on the
      # ARM, driving the Amiga's bus through the core's proxy.
      - name: Build armcpu
        run: make -C tools/armcpu

      # bin/MiSTer is stripped by the Makefile; bin/MiSTer.elf keeps symbols.
      # `file` is the quickest confirmation this really is an ARM binary and not
      # something the host toolchain produced. The GLIBC_* dump is the number to
      # compare against `ldd --version` on the MiSTer if it ever fails to start.
      - name: Inspect output
        run: |
          set -euo pipefail
          ls -l bin/MiSTer bin/MiSTer.elf
          file bin/MiSTer
          md5sum bin/MiSTer
          echo "--- glibc symbol versions required ---"
          arm-none-linux-gnueabihf-objdump -p bin/MiSTer.elf \
            | grep -o 'GLIBC_[0-9.]*' | sort -u -V || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: MiSTer_AmigaCD
          path: |
            bin/MiSTer
            bin/MiSTer.elf
            tools/latprobe/latprobe
            tools/armcpu/armcpu
          if-no-files-found: error
          # Without this these keep the repository default and never expire. 493
          # of them accumulated from 2026-07-30 onward, 0.83 GB, which is over
          # the 500 MB cap for a private repo -- and once the cap is hit every
          # build fails at this step, including on a docs-only PR. 483 were
          # deleted by hand on 2026-09-28; this stops it happening again.
          #
          # 14 days is chosen against how these are used: scripts/deploy-from-ci.sh
          # pulls a run's binary onto the MiSTer, and that is always a recent run.
          # Anything older is rebuilt faster than it would be retrieved.
          retention-days: 14

  # RTL simulation. Icarus rather than ModelSim: ModelSim is not installed on the
  # dev machine (C:\intelFPGA_lite\17.0 carries quartus only), and the testbench is
  # plain Verilog with no vendor primitives.
  #
  # No GHDL here on purpose. The one VHDL testbench in this project drives
  # TG68KdotC_Kernel, and the TG68K sources live in the core repo
  # (Minimig-AGA-cd32-cdtv), not this one -- there is nothing here for GHDL to
  # compile. That bench runs from the core repo's .github/workflows/rtl-sim.yml,
  # which installs ghdl alongside iverilog. See rtl/sim/tg68k/ over there.
  rtl-sim:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # This repository has a second bench tree, rtl/tb/, with its own naming
      # convention -- so the gate in the core repo neither scans it nor would
      # match these names. It covers the save-state controller, DMA, CRC,
      # quiesce, serialiser, register shadow and state fanout: the most
      # bug-prone code here. All ten are wired; this keeps them that way,
      # because the failure mode is silent. A bench nobody runs reads as
      # coverage.
      - name: Every bench in rtl/tb is run
        run: python3 rtl/tb/check-benches-wired.py

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Ten of the files the benches below compile are COPIES of the AmigaCD
      # core's. They are built there, not here; they exist here because their
      # testbenches do. This checks each one still hashes to what
      # rtl/core-rtl.vendor records, so a copy edited in place fails at the
      # commit that did it instead of drifting.
      #
      # Runs FIRST, before any bench. A green bench against a stale copy is
      # exactly the state this repository was in until 2026-09-15 -- ss_ctrl.v
      # here was two commits behind what the core synthesised, and CI was green
      # on both sides throughout. Knowing which module was tested comes before
      # knowing that it passed.
      #
      # It cannot catch the core moving; that needs a checkout of the core,
      # which CI has no token for. Deliberately a hard local check rather than a
      # cross-repo one that degrades to "skipped" when a secret is absent.
      #
      # If this fails, do NOT restamp to make it green. See rtl/core-rtl.vendor.
      - name: Vendored core RTL matches its stamp
        run: ./core_rtl_vendor_check.sh

      # Two runs, because every timing constant in snac_psx.v is derived from
      # CLK_KHZ and a single-rate testbench cannot see a constant that failed to
      # scale -- the inter-poll gap was a raw counter for exactly this reason,
      # and 50 MHz sim plus 100 MHz synthesis meant nothing ever checked it.
      # 50 MHz is the testbench default; 100 MHz is what the Menu core
      # instantiates. Icarus overrides a top-level parameter with -P.
      - name: Build testbench (50 MHz)
        run: |
          set -euo pipefail
          mkdir -p build
          iverilog -g2005 -Wall -o build/snac_psx_tb \
            rtl/snac_psx.v rtl/tb/psx_pad_model.v rtl/tb/snac_psx_tb.v

      - name: Run testbench (50 MHz)
        run: vvp build/snac_psx_tb

      - name: Build testbench (100 MHz)
        run: |
          set -euo pipefail
          mkdir -p build
          iverilog -g2005 -Wall -Psnac_psx_tb.CLK_KHZ=100000 \
            -o build/snac_psx_tb_100 \
            rtl/snac_psx.v rtl/tb/psx_pad_model.v rtl/tb/snac_psx_tb.v

      - name: Run testbench (100 MHz)
        run: vvp build/snac_psx_tb_100

      - name: Build CD32 mapping testbench
        run: iverilog -g2005 -Wall -o build/snac_cd32_tb rtl/snac_cd32.v rtl/tb/snac_cd32_tb.v

      - name: Run CD32 mapping testbench
        run: vvp build/snac_cd32_tb

      - name: Build save state CRC testbench
        run: iverilog -g2005 -Wall -o build/ss_crc32_tb rtl/ss_crc32.v rtl/tb/ss_crc32_tb.v

      - name: Run save state CRC testbench
        run: vvp build/ss_crc32_tb

      - name: Build quiesce testbench
        run: iverilog -g2005 -Wall -o build/ss_quiesce_tb rtl/ss_quiesce.v rtl/tb/ss_quiesce_tb.v

      - name: Run quiesce testbench
        run: vvp build/ss_quiesce_tb

      - name: Build state serialiser testbench
        run: iverilog -g2005 -Wall -o build/ss_serdes_tb rtl/ss_serdes.v rtl/tb/ss_serdes_tb.v

      - name: Run state serialiser testbench
        run: vvp build/ss_serdes_tb

      - name: Build chip RAM readout testbench
        run: iverilog -g2005 -Wall -o build/ss_dma_tb rtl/ss_dma.v rtl/tb/ss_dma_tb.v

      - name: Run chip RAM readout testbench
        run: vvp build/ss_dma_tb

      # The freeze's two clk_sys-domain signals. The parking PHASE they choose
      # is what stops a replay's register-decode ticks from walking the beam,
      # and it is checked end to end against the real amiga_clk in the core
      # repo's rtl/sim/ssmux bench; this one covers the sampling rule itself.
      - name: Build freeze phase testbench
        run: iverilog -g2005 -Wall -o build/ss_freeze_phase_tb rtl/ss_freeze_phase.v rtl/tb/ss_freeze_phase_tb.v

      - name: Run freeze phase testbench
        run: vvp build/ss_freeze_phase_tb

      # The restore's register-write sequencer: the sixteen CPU registers in
      # index order, the five singles, the map bits, and the re-seed last with
      # the CPU still parked. -g2012 for the .sv, -I. so `include "rtl/..." works
      # from the repo root the way it does for Quartus.
      - name: Build state fanout testbench
        run: iverilog -g2012 -Wall -I. -o build/ss_state_fanout_tb rtl/ss_state_fanout.sv rtl/tb/ss_state_fanout_tb.v

      - name: Run state fanout testbench
        run: vvp build/ss_state_fanout_tb

      # The chipset register shadow on its own: the snoop, the set/clear rule,
      # the exclusions, the load path and the replay ordering.
      - name: Build register shadow testbench
        run: iverilog -g2005 -Wall -o build/ss_regshadow_tb rtl/ss_regshadow.v rtl/tb/ss_regshadow_tb.v

      - name: Run register shadow testbench
        run: vvp build/ss_regshadow_tb

      - name: Build save state controller testbench
        run: |
          iverilog -g2005 -Wall -o build/ss_ctrl_tb \
            rtl/ss_ctrl.v rtl/ss_crc32.v rtl/ss_quiesce.v rtl/ss_serdes.v \
            rtl/ss_dma.v rtl/ss_regshadow.v rtl/tb/ss_ctrl_tb.v

      - name: Run save state controller testbench
        run: vvp build/ss_ctrl_tb

  # Native unit tests for dependency-free host modules. Separate from the ARM
  # cross-build because these run on the CI host directly.
  host-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # menu.sv in FringeCoder/Menu_MiSTer packs snac_state and snac_psx_poll()
      # here unpacks it. Nothing connects the two but the word order, and getting
      # it wrong makes every button a different button -- which looks like a
      # broken pad reader rather than a field order. Neither repository can see
      # the other in CI, so each is pinned to the table in
      # docs/snac-state-contract.md; a change on either side that is not also a
      # change to that table fails where it was made. The Menu core runs the
      # same check on its packing side.
      #
      # If this fails, do NOT delete it as stale: the unpacking has moved, and
      # the fields are about to be read out of the wrong words.
      - name: snac_state word order matches the contract
        run: ./snac_state_check.sh

      # Also runs tests/test_deploy_core_prune.sh, which is not a compiled test
      # but belongs to the same target for a reason worth stating: it covers the
      # only code here that deletes files -- scripts/deploy-core.sh's prune rule,
      # which removes superseded cores from the SD card over ssh. An off-by-one
      # there deletes the working core you keep as the way back, and the first
      # sign of it is a machine that will not boot the thing you were testing.
      - name: Run native unit tests
        run: make -C tests

      # latprobe's protocol against a stand-in for the FPGA probe on a plain
      # file: every request answered exactly once, the stats parsed from the
      # response format, the probe disarmed on exit. A wrong word order or a
      # broken disarm would leave the real probe polling DDR3 flat out.
      - name: latprobe protocol (host)
        run: python3 tools/latprobe/test_echo.py

      # armcpu on a plain file standing in for the bridge, with a hand-assembled
      # ROM: reset vectors and overlay from the ROM, big-endian writes, the
      # overlay following CIA-A, RESET restoring it, the bus given back.
      - name: armcpu emulator (host)
        run: python3 tools/armcpu/test_armcpu.py

      # The same compiled tests under ASan and UBSan. Some of what they guard is
      # undefined behaviour that glibc happens to get right: mgl_rbf.cpp's
      # memmove of a tail that overlaps itself passes every check above as
      # memcpy too, and only a sanitiser sees the overlap (docs/state-todo.md
      # U5). Every finding is fatal. Falsified 2026-10-19: that memmove -> memcpy
      # fails here with memcpy-param-overlap and passes the step above.
      - name: Run native unit tests under sanitizers
        run: make -C tests sanitize
